<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TikTok bağlantısı | Gülümseyelim</title><link rel="stylesheet" href="styles.css"></head>
  <body>
    <main class="callback">
      <p class="eyebrow">TikTok bağlantısı</p><h1>İzin sonucu</h1>
      <p id="callback-message">TikTok yanıtı kontrol ediliyor…</p>
      <a class="button button-primary" href="index.html">Gülümseyelim'e dön</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const message = document.querySelector("#callback-message");
      const expected = sessionStorage.getItem("tiktok_oauth_state");
      if (params.get("error")) message.textContent = "TikTok izin vermedi. Ana sayfaya dönüp tekrar deneyebilirsin.";
      else if (!params.get("code") || !expected || params.get("state") !== expected) message.textContent = "TikTok yanıtı doğrulanamadı. Lütfen bağlantıyı ana sayfadan yeniden başlat.";
      else message.textContent = "TikTok izni başarıyla alındı. Bu demo akışında yetkilendirme kodu doğrulandı; gizli anahtar tarayıcıya gönderilmedi.";
      sessionStorage.removeItem("tiktok_oauth_state");
    </script>
  </body>
</html>
